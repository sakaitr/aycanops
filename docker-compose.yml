services:
  app:
    image: aycanops-runner:latest
    container_name: aycanops_app
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Istanbul
    # Clean stale Chromium lock files before starting (prevents "profile in use" errors on restart)
    command: sh -c "rm -f /app/.wwebjs_auth/session/SingletonLock /app/.wwebjs_auth/session/SingletonSocket /app/.wwebjs_auth/session/SingletonCookie && node server.js"
    volumes:
      - ./dist:/app
      - wwebjs_auth:/app/.wwebjs_auth
      - denetim_photos:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aycannet
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aycanops.rule=Host(`aycanops.agno.digital`)"
      - "traefik.http.routers.aycanops.tls.certresolver=letsencrypt"
      - "traefik.http.services.aycanops.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

  agno_digital_app:
    build: /opt/agno-digital
    image: agno-digital:latest
    container_name: agno_digital_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - aycannet

  db:
    image: mariadb:11.4
    container_name: aycanops_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - aycanops_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aycannet

  cron:
    image: alpine:3.19
    container_name: aycanops_cron
    restart: unless-stopped
    command: >
      sh -c "
        apk add --no-cache curl &&
        { echo '0 7 * * * curl -s -X POST http://app:3000/api/cron/notify -H \"x-cron-secret: aycan-cron-2026\" -o /dev/null';
          echo '0 4 * * * curl -s -X POST http://app:3000/api/cron/cleanup-photos -H \"x-cron-secret: aycan-cron-2026\" -o /dev/null'; } > /etc/crontabs/root &&
        crond -f -l 6
      "
    depends_on:
      - app
    networks:
      - aycannet

  nginx:
    image: nginx:alpine
    container_name: aycanops_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/aycanops.conf:/etc/nginx/conf.d/aycanops.conf:ro
      - ./nginx/agno-digital.conf:/etc/nginx/conf.d/agno-digital.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
      - agno_digital_app
    networks:
      - aycannet

networks:
  aycannet:
  traefik-public:
    external: true

volumes:
  aycanops_db_data:
  letsencrypt:
  certbot_www:
  wwebjs_auth:
  denetim_photos:
